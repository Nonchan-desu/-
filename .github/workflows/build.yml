          cat > app/src/main/java/com/example/intervalcue/Cues.kt <<'SRC_EOF_9'
          package com.example.intervalcue

          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat

          /**
           * 合図の通知。
           * HUAWEI Health が「新しい通知」をバンドへ転送し、バンドが振動する。
           * 転送を確実にするため、合図ごとに新しい通知IDで出し、直前の合図は消す。
           */
          object Cues {
              const val CH_CUE = "cue_v1"
              const val CH_RUNNING = "running_v1"

              private var lastId = -1
              private var seq = 2000

              fun ensureChannels(ctx: Context) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CH_CUE, "合図（バンドに転送）", NotificationManager.IMPORTANCE_HIGH).apply {
                          description = "運動・レストの切り替わりで出る通知。HUAWEI Health がバンドへ転送します。"
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 400, 150, 400)
                      }
                  )
                  nm.createNotificationChannel(
                      NotificationChannel(CH_RUNNING, "実行中の表示", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "タイマー実行中に表示される常駐通知（振動しません）"
                          setShowBadge(false)
                      }
                  )
              }

              fun openAppIntent(ctx: Context): PendingIntent =
                  PendingIntent.getActivity(
                      ctx, 0,
                      Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

              @SuppressLint("MissingPermission")
              /** 合図を1回出す。timeoutMs を過ぎると通知は自動で消える */
              fun post(ctx: Context, title: String, text: String, timeoutMs: Long? = null) {
                  ensureChannels(ctx)
                  val nm = NotificationManagerCompat.from(ctx)
                  if (!nm.areNotificationsEnabled()) return
                  if (lastId >= 0) nm.cancel(lastId)
                  val id = seq++
                  val n = NotificationCompat.Builder(ctx, CH_CUE)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
                      .setAutoCancel(true)
                      .setContentIntent(openAppIntent(ctx))
                      .apply { if (timeoutMs != null && timeoutMs > 0) setTimeoutAfter(timeoutMs) }
                      .build()
                  try {
                      nm.notify(id, n)
                      lastId = id
                  } catch (_: SecurityException) {
                      // 通知権限がない
                  }
              }

              fun cancelLast(ctx: Context) {
                  if (lastId >= 0) NotificationManagerCompat.from(ctx).cancel(lastId)
                  lastId = -1
              }
          }
